name: RopeCounter
options:
  bundleIdPrefix: com.yzrun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  RopeCore:
    path: RopeCore
settings:
  base:
    DEVELOPMENT_TEAM: DYG78PPG68
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RopeCounter:
    type: application
    platform: iOS
    sources:
      - path: RopeCounter
        excludes: ["Info.plist"]
    dependencies:
      - package: RopeCore
      - framework: Frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - framework: Frameworks/MediaPipeTasksCommon.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yzrun.ropecounter
        INFOPLIST_FILE: RopeCounter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-lc++", "-ObjC"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
