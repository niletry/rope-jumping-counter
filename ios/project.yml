name: RopeCounter
options:
  bundleIdPrefix: com.yzrun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  RopeCore:
    path: RopeCore
settings:
  base:
    DEVELOPMENT_TEAM: DYG78PPG68
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RopeCounter:
    type: application
    platform: iOS
    sources:
      - path: RopeCounter
        excludes: ["Info.plist"]
    dependencies:
      - package: RopeCore
      - framework: Frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - framework: Frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: CoreMedia.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yzrun.ropecounter
        INFOPLIST_FILE: RopeCounter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-lc++", "-ObjC"]
        # The MediaPipe graph (model runtime) ships as a separate static archive per SDK that
        # must be force-loaded, exactly as the CocoaPods spec does.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ["$(inherited)", "-force_load", "$(SRCROOT)/Frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"]
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(inherited)", "-force_load", "$(SRCROOT)/Frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
